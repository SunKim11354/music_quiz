<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classical Music Quiz V3</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#192434;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:730px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(22px,4vw,30px);margin:12px 0}h2{font-size:21px}button,select{font:inherit}button{cursor:pointer;border:1px solid #a8b4c3;background:white;border-radius:11px;padding:12px 17px}button:disabled{opacity:.5;cursor:default}.primary{background:#163b68;color:white;border-color:#163b68}.panel{background:white;border:1px solid #dce3ec;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 3px 15px #132a4410}.muted{color:#5e6b7c}.choices{display:grid;grid-template-columns:1fr;gap:12px;margin:24px 0}.choice{text-align:left;padding:16px;line-height:1.55}.choice.correct{border:2px solid #167d4d;background:#eaf8f0}.choice.wrong{border:2px solid #b34343;background:#fff1f1}audio{width:100%;margin:16px 0} .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.explain{background:#f3f6fa;border-radius:12px;padding:16px;line-height:1.75;margin:18px 0}.small{font-size:13px}.hidden{display:none!important}.progress{font-weight:700}.spaced{margin-top:18px}.summary{border-bottom:1px solid #e4e8ef;padding:14px 0;line-height:1.65}@media(min-width:620px){.choices{grid-template-columns:1fr 1fr}} </style></head><body><main class="wrap"><header><div><div class="muted small">Offline-file audio · GitHub Pages ready</div><h1 id="title">클래식 음악 퀴즈 V3</h1></div><label><span id="langLabel">언어</span> <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select></label></header><section class="panel" id="home"><p id="intro">명곡 다섯 곡을 듣고 제목을 맞혀 보세요. 문제당 최대 2분간 들을 수 있습니다.</p><p class="muted small" id="notice">음악은 사용자 조작으로 재생되며, 정답을 고르면 즉시 멈춥니다.</p><button class="primary" id="start">게임 시작</button></section><section class="panel hidden" id="game"><div class="progress" id="progress"></div><h2 id="prompt">이 음악의 제목은 무엇일까요?</h2><p class="muted small" id="time"></p><audio id="player" controls preload="none" controlsList="nodownload noplaybackrate"></audio><div class="choices" id="choices"></div><div id="feedback" class="hidden"><div id="result"></div><div class="explain" id="story"></div></div><div class="actions"><button class="primary hidden" id="next">다음 문제</button><button id="stop">그만 하기</button></div></section><section class="panel hidden" id="done"><h2 id="doneTitle"></h2><p id="score"></p><h2 id="encountered"></h2><div id="summaries"></div><div class="actions spaced"><button class="primary" id="restart">다시 시작</button></div></section><p class="muted small spaced" id="footer">음원은 각 원본 파일의 개별 라이선스에 따릅니다. 파일 출처는 SOURCES.txt를 확인하세요.</p></main><script>
'use strict';
const tracks=[
{id:'fur',file:'beethoven_fur_elise.ogg',ko:'베토벤 — 엘리제를 위하여',en:'Beethoven — Für Elise',bgko:'1810년경 작곡된 피아노 소품으로, 사후에 출판되었습니다.',bgen:'A piano bagatelle composed around 1810 and published posthumously.',storyko:'반복되는 친숙한 첫 선율과 대조적인 중간 부분이 특징입니다. 제목에 등장하는 엘리제의 신원은 확정되지 않았습니다.',storyen:'Its famous recurring opening theme alternates with contrasting episodes. The identity of “Elise” remains uncertain.'},
{id:'moon',file:'beethoven_moonlight_1.ogg',ko:'베토벤 — 월광 소나타 제1악장',en:'Beethoven — Moonlight Sonata, I',bgko:'1801년에 완성된 피아노 소나타 14번의 첫 악장입니다.',bgen:'The first movement of Piano Sonata No. 14, completed in 1801.',storyko:'느린 아르페지오 위로 선율이 흐르는 악장입니다. ‘월광’이라는 별명은 베토벤 사후에 널리 퍼졌습니다.',storyen:'A slow melody unfolds over repeating arpeggios. The nickname “Moonlight” became popular after Beethoven’s lifetime.'},
{id:'mozart',file:'mozart_turkish_march.ogg',ko:'모차르트 — 터키 행진곡',en:'Mozart — Turkish March',bgko:'피아노 소나타 11번 K.331의 마지막 악장으로, 18세기 유럽의 터키풍 음악 유행을 반영합니다.',bgen:'The finale of Piano Sonata No. 11, K.331, reflecting the 18th-century European fashion for Turkish-style music.',storyko:'명료한 리듬과 빠른 장식음이 인상적인 론도입니다. 흔히 독립된 소품처럼 연주됩니다.',storyen:'A lively rondo with crisp rhythms and ornaments, often performed as a standalone piece.'},
{id:'chopin',file:'chopin_nocturne_op9_2.ogg',ko:'쇼팽 — 녹턴 Op.9 No.2',en:'Chopin — Nocturne Op. 9 No. 2',bgko:'1830년대 초 발표된 쇼팽의 초기 녹턴 가운데 가장 유명한 작품 중 하나입니다.',bgen:'One of Chopin’s best-known early nocturnes, published in the early 1830s.',storyko:'노래하듯 흐르는 오른손 선율과 부드러운 반주가 특징이며, 선율이 돌아올 때마다 장식이 달라집니다.',storyen:'A singing right-hand melody floats over a gentle accompaniment, with varied ornaments on its returns.'},
{id:'bach',file:'bach_prelude_bwv846.ogg',ko:'바흐 — 평균율 전주곡 1번 C장조',en:'Bach — Prelude No. 1 in C Major, BWV 846',bgko:'1722년 완성된 《평균율 클라비어곡집》 제1권의 첫 곡입니다.',bgen:'The opening piece of Book I of The Well-Tempered Clavier, completed in 1722.',storyko:'끊임없이 이어지는 분산화음이 화성의 변화를 들려줍니다. 이후 구노의 《아베 마리아》 선율에도 바탕이 되었습니다.',storyen:'Continuous broken chords trace a changing harmony. Gounod later used the prelude as the basis for his Ave Maria.'}
];
const $=id=>document.getElementById(id),player=$('player');let order=[],index=0,score=0,answered=false,seen=[],timer=null,seconds=0,expired=false;
const ui={ko:{title:'클래식 음악 퀴즈 V3',lang:'언어',intro:'명곡 다섯 곡을 듣고 제목을 맞혀 보세요. 문제당 최대 2분간 들을 수 있습니다.',notice:'음악은 재생 버튼을 눌러 시작하며, 정답을 고르면 즉시 멈춥니다.',start:'게임 시작',prompt:'이 음악의 제목은 무엇일까요?',next:'다음 문제',finish:'결과 보기',stop:'그만 하기',restart:'다시 시작',done:'게임 결과',met:'오늘 만난 작품들',correct:'정답입니다!',wrong:'아쉽습니다. 정답:',background:'배경',about:'작품 이야기',listen:'청취 시간',limit:'2분 청취 제한에 도달했습니다. 정답을 선택하세요.',footer:'음원은 각 원본 파일의 개별 라이선스에 따릅니다. 파일 출처는 SOURCES.txt를 확인하세요.',score:(a,b)=>`${b}문제 중 ${a}문제 정답`,progress:(a,b)=>`문제 ${a} / ${b}`},en:{title:'Classical Music Quiz V3',lang:'Language',intro:'Identify five famous classical pieces. Listen for up to two minutes per question.',notice:'Press Play to start the music. Selecting an answer stops it immediately.',start:'Start quiz',prompt:'What is the title of this piece?',next:'Next question',finish:'View results',stop:'End game',restart:'Play again',done:'Your results',met:'Pieces you encountered',correct:'Correct!',wrong:'Not quite. Correct answer:',background:'Background',about:'About the piece',listen:'Listening time',limit:'The two-minute listening limit is up. Please choose an answer.',footer:'Each audio file has its own reuse terms. See SOURCES.txt for provenance.',score:(a,b)=>`${a} correct out of ${b}`,progress:(a,b)=>`Question ${a} / ${b}`}};
let lang='ko';const t=()=>ui[lang],name=p=>p[lang==='ko'?'ko':'en'];function stopAudio(){player.pause();try{player.currentTime=0}catch(e){}stopTimer()}function stopTimer(){if(timer){clearInterval(timer);timer=null}}function show(id){for(const key of ['home','game','done'])$(key).classList.toggle('hidden',key!==id)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){stopAudio();order=shuffle([...tracks]);index=0;score=0;seen=[];show('game');render()}
function render(){stopAudio();answered=false;seconds=0;expired=false;const p=order[index];$('progress').textContent=t().progress(index+1,order.length);$('prompt').textContent=t().prompt;$('time').textContent=`${t().listen}: 0 / 120 s`;player.src='audio/'+encodeURIComponent(p.file);player.load();$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('next').textContent=index===order.length-1?t().finish:t().next;const answers=shuffle([...tracks]);$('choices').replaceChildren();for(const item of answers){const b=document.createElement('button');b.className='choice';b.textContent=name(item);b.dataset.id=item.id;b.addEventListener('click',()=>choose(item.id));$('choices').appendChild(b)}}
function choose(id){if(answered)return;answered=true;stopAudio();const p=order[index];seen.push(p);if(id===p.id)score++;for(const b of $('choices').children){b.disabled=true;if(b.dataset.id===p.id)b.classList.add('correct');else if(b.dataset.id===id)b.classList.add('wrong')}$('result').textContent=id===p.id?t().correct:t().wrong+' '+name(p);$('story').replaceChildren();const strong=document.createElement('strong');strong.textContent=t().background+': ';$('story').append(strong,document.createTextNode(p[lang==='ko'?'bgko':'bgen']));$('story').append(document.createElement('p'));const s=document.createElement('strong');s.textContent=t().about+': ';$('story').lastChild.append(s,document.createTextNode(p[lang==='ko'?'storyko':'storyen']));$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}
function finish(){stopAudio();show('done');$('doneTitle').textContent=t().done;$('score').textContent=t().score(score,seen.length);$('encountered').textContent=t().met;$('summaries').replaceChildren();for(const p of seen){const d=document.createElement('div');d.className='summary';const h=document.createElement('strong');h.textContent=name(p);const a=document.createElement('p');a.textContent=t().background+': '+p[lang==='ko'?'bgko':'bgen'];const b=document.createElement('p');b.textContent=p[lang==='ko'?'storyko':'storyen'];d.append(h,a,b);$('summaries').append(d)}}
function refresh(){document.documentElement.lang=lang;for(const [id,key] of [['title','title'],['langLabel','lang'],['intro','intro'],['notice','notice'],['start','start'],['stop','stop'],['restart','restart'],['footer','footer']])$(id).textContent=t()[key];if(!$('game').classList.contains('hidden')){if(!answered){$('progress').textContent=t().progress(index+1,order.length);$('prompt').textContent=t().prompt;for(const b of $('choices').children){const item=tracks.find(x=>x.id===b.dataset.id);b.textContent=name(item)}$('time').textContent=expired?t().limit:`${t().listen}: ${seconds} / 120 s`;}else{const p=order[index];$('progress').textContent=t().progress(index+1,order.length);$('prompt').textContent=t().prompt;for(const b of $('choices').children){const item=tracks.find(x=>x.id===b.dataset.id);b.textContent=name(item)}$('result').textContent=$('choices').querySelector('.choice.correct').dataset.id===order[index].id&&$('choices').querySelector('.choice.correct').classList.contains('wrong')?'':($('choices').querySelector('.choice.wrong')?t().wrong+' '+name(p):t().correct);$('story').textContent=t().background+': '+p[lang==='ko'?'bgko':'bgen']+' · '+t().about+': '+p[lang==='ko'?'storyko':'storyen'];$('next').textContent=index===order.length-1?t().finish:t().next}}if(!$('done').classList.contains('hidden'))finish()}
player.addEventListener('play',()=>{if(answered||expired){player.pause();return}if(!timer)timer=setInterval(()=>{if(player.paused)return;seconds++;$('time').textContent=`${t().listen}: ${seconds} / 120 s`;if(seconds>=120){expired=true;player.pause();stopTimer();$('time').textContent=t().limit}},1000)});player.addEventListener('ended',stopTimer);$('start').addEventListener('click',start);$('restart').addEventListener('click',start);$('next').addEventListener('click',()=>{if(index+1===order.length)finish();else{index++;render()}});$('stop').addEventListener('click',finish);$('lang').addEventListener('change',e=>{lang=e.target.value;refresh()});window.addEventListener('pagehide',stopAudio);refresh();
</script></body></html>
