<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classical Music Quiz V5.3</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#192434;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:730px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(22px,4vw,30px);margin:12px 0}h2{font-size:21px}button,select{font:inherit}button{cursor:pointer;border:1px solid #a8b4c3;background:white;border-radius:11px;padding:12px 17px}button:disabled{opacity:.5;cursor:default}.primary{background:#163b68;color:white;border-color:#163b68}.panel{background:white;border:1px solid #dce3ec;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 3px 15px #132a4410}.muted{color:#5e6b7c}.choices{display:grid;grid-template-columns:1fr;gap:12px;margin:24px 0}.choice{text-align:left;padding:16px;line-height:1.55}.choice.correct{border:2px solid #167d4d;background:#eaf8f0}.choice.wrong{border:2px solid #b34343;background:#fff1f1}audio{width:100%;margin:16px 0} .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.explain{background:#f3f6fa;border-radius:12px;padding:16px;line-height:1.75;margin:18px 0}.small{font-size:13px}.hidden{display:none!important}.progress{font-weight:700}.spaced{margin-top:18px}.summary{border-bottom:1px solid #e4e8ef;padding:14px 0;line-height:1.65}@media(min-width:620px){.choices{grid-template-columns:1fr 1fr}} </style></head><body><main class="wrap"><header><div><div class="muted small">11 tracks · 5 questions per game · GitHub Pages ready</div><h1 id="title">클래식 음악 퀴즈 V5.3</h1></div><label><span id="langLabel">언어</span> <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select></label></header><section class="panel" id="home"><p id="intro">명곡 다섯 곡을 듣고 제목을 맞혀 보세요. 문제당 최대 2분간 들을 수 있습니다.</p><p class="muted small" id="notice">음악은 사용자 조작으로 재생되며, 정답을 고르면 즉시 멈춥니다.</p><div class="spaced" style="margin-bottom:18px"><label for="startLang" id="startLangLabel" style="display:block;font-weight:700;margin-bottom:8px">게임 언어 선택 / Choose your language</label><select id="startLang" style="width:100%;max-width:320px;padding:12px;border-radius:10px;border:1px solid #a8b4c3"><option value="ko">한국어</option><option value="en">English</option></select></div><button class="primary" id="start">게임 시작</button></section><section class="panel hidden" id="game"><div class="progress" id="progress"></div><h2 id="prompt">이 음악의 제목은 무엇일까요?</h2><p class="muted small" id="time"></p><audio id="player" controls preload="none" controlsList="nodownload noplaybackrate"></audio><button id="tapPlay" class="primary hidden" type="button" style="width:100%;margin:8px 0 12px">▶ 음악 재생 / Tap to Play</button><p id="audioStatus" class="muted small" role="status" aria-live="polite"></p><div class="choices" id="choices"></div><div id="feedback" class="hidden"><div id="result"></div><div class="explain" id="story"></div></div><div class="actions"><button class="primary hidden" id="next">다음 문제</button><button id="stop">그만 하기</button></div></section><section class="panel hidden" id="done"><h2 id="doneTitle"></h2><p id="score"></p><h2 id="encountered"></h2><div id="summaries"></div><div class="actions spaced"><button class="primary" id="restart">다시 시작</button></div></section><p class="muted small spaced" id="footer">음원은 각 원본 파일의 개별 라이선스에 따릅니다. 파일 출처는 SOURCES.txt를 확인하세요.</p></main><script>
'use strict';
const tracks=[
{id:'fur',file:'beethoven_fur_elise.ogg',alternates:['FurElise.ogg'],ko:'베토벤 — 엘리제를 위하여',en:'Beethoven — Für Elise',bgko:'1810년경 작곡된 피아노 소품으로, 사후에 출판되었습니다.',bgen:'A piano bagatelle composed around 1810 and published posthumously.',storyko:'반복되는 친숙한 첫 선율과 대조적인 중간 부분이 특징입니다. 제목에 등장하는 엘리제의 신원은 확정되지 않았습니다.',storyen:'Its famous recurring opening theme alternates with contrasting episodes. The identity of “Elise” remains uncertain.'},
{id:'moon',file:'beethoven_moonlight_1.ogg',alternates:['Moonlight_Sonata.ogg'],ko:'베토벤 — 월광 소나타 제1악장',en:'Beethoven — Moonlight Sonata, I',bgko:'1801년에 완성된 피아노 소나타 14번의 첫 악장입니다.',bgen:'The first movement of Piano Sonata No. 14, completed in 1801.',storyko:'느린 아르페지오 위로 선율이 흐르는 악장입니다. ‘월광’이라는 별명은 베토벤 사후에 널리 퍼졌습니다.',storyen:'A slow melody unfolds over repeating arpeggios. The nickname “Moonlight” became popular after Beethoven’s lifetime.'},
{id:'mozart',file:'mozart_turkish_march.ogg',alternates:['Mozart-Marsz_turecki-(Romuald_Greiss).ogg'],ko:'모차르트 — 터키 행진곡',en:'Mozart — Turkish March',bgko:'피아노 소나타 11번 K.331의 마지막 악장으로, 18세기 유럽의 터키풍 음악 유행을 반영합니다.',bgen:'The finale of Piano Sonata No. 11, K.331, reflecting the 18th-century European fashion for Turkish-style music.',storyko:'명료한 리듬과 빠른 장식음이 인상적인 론도입니다. 흔히 독립된 소품처럼 연주됩니다.',storyen:'A lively rondo with crisp rhythms and ornaments, often performed as a standalone piece.'},
{id:'chopin',file:'chopin_nocturne_op9_2.ogg',alternates:['Chopin.Nocturne.Es-Dur.opus.9.2.ogg'],ko:'쇼팽 — 녹턴 Op.9 No.2',en:'Chopin — Nocturne Op. 9 No. 2',bgko:'1830년대 초 발표된 쇼팽의 초기 녹턴 가운데 가장 유명한 작품 중 하나입니다.',bgen:'One of Chopin’s best-known early nocturnes, published in the early 1830s.',storyko:'노래하듯 흐르는 오른손 선율과 부드러운 반주가 특징이며, 선율이 돌아올 때마다 장식이 달라집니다.',storyen:'A singing right-hand melody floats over a gentle accompaniment, with varied ornaments on its returns.'},
{id:'bach',file:'bach_prelude_bwv846.ogg',alternates:['Kevin_MacLeod_-_J_S_Bach_Prelude_in_C_-_BWV_846.ogg'],ko:'바흐 — 평균율 전주곡 1번 C장조',en:'Bach — Prelude No. 1 in C Major, BWV 846',bgko:'1722년 완성된 《평균율 클라비어곡집》 제1권의 첫 곡입니다.',bgen:'The opening piece of Book I of The Well-Tempered Clavier, completed in 1722.',storyko:'끊임없이 이어지는 분산화음이 화성의 변화를 들려줍니다. 이후 구노의 《아베 마리아》 선율에도 바탕이 되었습니다.',storyen:'Continuous broken chords trace a changing harmony. Gounod later used the prelude as the basis for his Ave Maria.'}
,{id:'vivaldi_spring',file:'Vivaldi_-_Four_Seasons_1_Spring_mvt_1_Allegro_-_John_Harrison_violin.oga',alternates:['vivaldi_spring_1.oga'],ko:'비발디 — 사계 「봄」 제1악장',en:'Vivaldi — The Four Seasons: Spring, I',bgko:'1725년에 출판된 협주곡집 《화성과 창의의 시도》에 수록된 《사계》의 첫 악장입니다.',bgen:'The opening movement of The Four Seasons, published in 1725 within The Contest Between Harmony and Invention.',storyko:'새소리와 시냇물, 천둥과 번개를 바이올린과 합주로 그립니다.',storyen:'The violins evoke birdsong, flowing streams, and a passing thunderstorm.'}
,{id:'vivaldi_summer',file:'Vivaldi_-_Four_Seasons_2_Summer_mvt_3_Presto_-_John_Harrison_violin.oga',alternates:['vivaldi_summer_3.oga'],ko:'비발디 — 사계 「여름」 제3악장',en:'Vivaldi — The Four Seasons: Summer, III (Presto)',bgko:'《사계》의 두 번째 협주곡 「여름」을 마무리하는 빠른 악장입니다.',bgen:'The fast final movement of Summer, the second concerto in The Four Seasons.',storyko:'휘몰아치는 음형으로 한여름의 격렬한 폭풍을 표현합니다.',storyen:'Rapid figures vividly depict a violent summer storm.'}
,{id:'pachelbel',file:'Canon_and_Gigue_in_D.ogg',alternates:['pachelbel_canon.ogg'],ko:'파헬벨 — 캐논 D장조',en:'Pachelbel — Canon in D',bgko:'바로크 시대 독일 작곡가 파헬벨의 유명한 캐논으로, 작곡 연대는 정확히 알려지지 않았습니다.',bgen:'A celebrated canon by the German Baroque composer Johann Pachelbel; its exact composition date is unknown.',storyko:'반복되는 저음 진행 위에서 여러 성부가 같은 선율을 차례로 따라갑니다.',storyen:'Voices enter successively with the same melody over a repeating bass pattern.'}
,{id:'mozart_nacht',file:'Mozart_-_Eine_kleine_Nachtmusik_-_1._Allegro.ogg',alternates:['mozart_eine_kleine_1.ogg'],ko:'모차르트 — 아이네 클라이네 나흐트무지크 제1악장',en:'Mozart — Eine kleine Nachtmusik, I',bgko:'1787년에 작곡한 현악 세레나데 K.525의 첫 악장입니다.',bgen:'The opening movement of Mozart’s String Serenade in G major, K. 525, composed in 1787.',storyko:'힘차게 시작하는 첫 주제와 경쾌한 현악 앙상블이 인상적입니다.',storyen:'A bold opening theme and lively string writing make this movement instantly recognizable.'}
,{id:'swan',file:'Tchaikovsky_Swan_Lake_Op.20_No.10._Scène.ogg',alternates:['tchaikovsky_swan_scene.ogg'],ko:'차이콥스키 — 백조의 호수 「정경」',en:'Tchaikovsky — Swan Lake: Scène',bgko:'1870년대에 작곡된 발레 《백조의 호수》에 나오는 음악입니다.',bgen:'Music from Tchaikovsky’s ballet Swan Lake, composed in the 1870s.',storyko:'애수 어린 선율로 호수와 백조의 신비로운 분위기를 그려냅니다.',storyen:'Its wistful melody evokes the mysterious atmosphere of the lake and the swans.'}
,{id:'bach_air',file:'Air.ogg',alternates:['bach_air.ogg'],ko:'바흐 — G선상의 아리아',en:'Bach — Air on the G String',bgko:'바흐의 관현악 모음곡 제3번 BWV 1068 중 느린 악장 ‘Air’입니다.',bgen:'The slow Air movement from Bach’s Orchestral Suite No. 3, BWV 1068.',storyko:'부드럽고 길게 이어지는 선율이 특징이며, ‘G선상의 아리아’는 후대 편곡에서 비롯된 이름입니다.',storyen:'Its sustained lyrical melody is famous; the title “Air on the G String” comes from a later arrangement.'}

const $=id=>document.getElementById(id),player=$('player');let order=[],index=0,score=0,answered=false,seen=[],timer=null,seconds=0,expired=false;const QUESTIONS_PER_GAME=5;const AUDIO_BASE_URL='audio/';let audioCandidates=[],candidateIndex=0,playRequested=false,audioGeneration=0;function audioURL(filename){return AUDIO_BASE_URL+encodeURIComponent(filename)}function setAudioStatus(message){$('audioStatus').textContent=message}function loadCandidate(){const filename=audioCandidates[candidateIndex];player.src=audioURL(filename);player.load()}function tryNextAudio(){if(candidateIndex+1<audioCandidates.length){candidateIndex++;setAudioStatus(lang==='ko'?'다른 파일명을 확인하고 있습니다…':'Trying an alternative filename…');loadCandidate();if(playRequested)playCurrent();}else{const file=audioCandidates[0]||'';setAudioStatus((lang==='ko'?'음원을 불러올 수 없습니다. GitHub audio 폴더의 파일명을 확인해 주세요: ':'Audio unavailable. Check the filename in your GitHub audio folder: ')+file);}}function playCurrent(){const promise=player.play();if(promise&&promise.then)promise.then(()=>{$('tapPlay').classList.add('hidden')}).catch(err=>{if(err.name==='NotAllowedError'){showTapPlay();setAudioStatus(lang==='ko'?'휴대전화에서 ▶ 음악 재생을 눌러 주세요.':'Tap ▶ Play Music to start on mobile.')}else if(err.name!=='AbortError' && player.error){tryNextAudio()}else if(err.name!=='AbortError'){showTapPlay()}})}function showTapPlay(){$('tapPlay').classList.remove('hidden');$('tapPlay').textContent=lang==='ko'?'▶ 음악 재생':'▶ Play Music'}
const ui={ko:{title:'클래식 음악 퀴즈 V5.3',lang:'언어',intro:'명곡 다섯 곡을 듣고 제목을 맞혀 보세요. 문제당 최대 2분간 들을 수 있습니다.',notice:'음악은 재생 버튼을 눌러 시작하며, 정답을 고르면 즉시 멈춥니다.',start:'게임 시작',prompt:'이 음악의 제목은 무엇일까요?',next:'다음 음악',finish:'결과 보기',stop:'그만 하기',restart:'다시 시작',done:'게임 결과',met:'오늘 만난 작품들',correct:'정답입니다!',wrong:'아쉽습니다. 정답:',background:'배경',about:'작품 이야기',listen:'청취 시간',limit:'2분 청취 제한에 도달했습니다. 정답을 선택하세요.',footer:'음원은 각 원본 파일의 개별 라이선스에 따릅니다. 파일 출처는 SOURCES.txt를 확인하세요.',score:(a,b)=>`${b}문제 중 ${a}문제 정답`,progress:(a,b)=>`문제 ${a} / ${b}`},en:{title:'Classical Music Quiz V5.3',lang:'Language',intro:'Identify five famous classical pieces. Listen for up to two minutes per question.',notice:'Press Play to start the music. Selecting an answer stops it immediately.',start:'Start quiz',prompt:'What is the title of this piece?',next:'Next Music',finish:'View results',stop:'End game',restart:'Play again',done:'Your results',met:'Pieces you encountered',correct:'Correct!',wrong:'Not quite. Correct answer:',background:'Background',about:'About the piece',listen:'Listening time',limit:'The two-minute listening limit is up. Please choose an answer.',footer:'Each audio file has its own reuse terms. See SOURCES.txt for provenance.',score:(a,b)=>`${a} correct out of ${b}`,progress:(a,b)=>`Question ${a} / ${b}`}};
let lang='ko';const t=()=>ui[lang],name=p=>p[lang==='ko'?'ko':'en'];function stopAudio(){player.pause();try{player.currentTime=0}catch(e){}stopTimer()}function stopTimer(){if(timer){clearInterval(timer);timer=null}}function show(id){for(const key of ['home','game','done'])$(key).classList.toggle('hidden',key!==id)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){lang=$('startLang').value;$('lang').value=lang;refresh();stopAudio();order=shuffle([...tracks]).slice(0,QUESTIONS_PER_GAME);index=0;score=0;seen=[];show('game');render(true)}
function render(autoPlay=false){stopAudio();answered=false;seconds=0;expired=false;const p=order[index];$('progress').textContent=t().progress(index+1,order.length);$('prompt').textContent=t().prompt;$('time').textContent=`${t().listen}: 0 / 120 s`;audioGeneration++;audioCandidates=[p.file,...(p.alternates||[])];candidateIndex=0;playRequested=autoPlay;setAudioStatus('');$('tapPlay').classList.add('hidden');loadCandidate();$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('next').textContent=index===order.length-1?t().finish:t().next;const distractors=shuffle(tracks.filter(x=>x.id!==p.id)).slice(0,3);const answers=shuffle([p,...distractors]);$('choices').replaceChildren();for(const item of answers){const b=document.createElement('button');b.className='choice';b.textContent=name(item);b.dataset.id=item.id;b.addEventListener('click',()=>choose(item.id));$('choices').appendChild(b)}if(autoPlay)playCurrent()}
function choose(id){if(answered)return;answered=true;$('tapPlay').classList.add('hidden');stopAudio();const p=order[index];seen.push(p);if(id===p.id)score++;for(const b of $('choices').children){b.disabled=true;if(b.dataset.id===p.id)b.classList.add('correct');else if(b.dataset.id===id)b.classList.add('wrong')}$('result').textContent=id===p.id?t().correct:t().wrong+' '+name(p);$('story').replaceChildren();const strong=document.createElement('strong');strong.textContent=t().background+': ';$('story').append(strong,document.createTextNode(p[lang==='ko'?'bgko':'bgen']));$('story').append(document.createElement('p'));const s=document.createElement('strong');s.textContent=t().about+': ';$('story').lastChild.append(s,document.createTextNode(p[lang==='ko'?'storyko':'storyen']));$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}
function finish(){stopAudio();show('done');$('doneTitle').textContent=t().done;$('score').textContent=t().score(score,seen.length);$('encountered').textContent=t().met;$('summaries').replaceChildren();for(const p of seen){const d=document.createElement('div');d.className='summary';const h=document.createElement('strong');h.textContent=name(p);const a=document.createElement('p');a.textContent=t().background+': '+p[lang==='ko'?'bgko':'bgen'];const b=document.createElement('p');b.textContent=p[lang==='ko'?'storyko':'storyen'];d.append(h,a,b);$('summaries').append(d)}}
function refresh(){document.documentElement.lang=lang;for(const [id,key] of [['title','title'],['langLabel','lang'],['intro','intro'],['notice','notice'],['start','start'],['stop','stop'],['restart','restart'],['footer','footer']])$(id).textContent=t()[key];if(!$('game').classList.contains('hidden')){if(!answered){$('progress').textContent=t().progress(index+1,order.length);$('prompt').textContent=t().prompt;for(const b of $('choices').children){const item=tracks.find(x=>x.id===b.dataset.id);b.textContent=name(item)}$('time').textContent=expired?t().limit:`${t().listen}: ${seconds} / 120 s`;}else{const p=order[index];$('progress').textContent=t().progress(index+1,order.length);$('prompt').textContent=t().prompt;for(const b of $('choices').children){const item=tracks.find(x=>x.id===b.dataset.id);b.textContent=name(item)}$('result').textContent=$('choices').querySelector('.choice.wrong')?t().wrong+' '+name(p):t().correct;$('story').textContent=t().background+': '+p[lang==='ko'?'bgko':'bgen']+' · '+t().about+': '+p[lang==='ko'?'storyko':'storyen'];$('next').textContent=index===order.length-1?t().finish:t().next}}if(!$('done').classList.contains('hidden'))finish()}
player.addEventListener('error',()=>{if(!answered&&audioCandidates.length)tryNextAudio()});player.addEventListener('playing',()=>{setAudioStatus('');$('tapPlay').classList.add('hidden')});$('tapPlay').addEventListener('click',()=>{playRequested=true;playCurrent()});player.addEventListener('play',()=>{if(answered||expired){player.pause();return}if(!timer)timer=setInterval(()=>{if(player.paused)return;seconds++;$('time').textContent=`${t().listen}: ${seconds} / 120 s`;if(seconds>=120){expired=true;player.pause();stopTimer();$('time').textContent=t().limit}},1000)});player.addEventListener('ended',stopTimer);$('start').addEventListener('click',start);$('restart').addEventListener('click',start);$('next').addEventListener('click',()=>{if(index+1===order.length)finish();else{index++;render(true)}});$('stop').addEventListener('click',finish);$('lang').addEventListener('change',e=>{lang=e.target.value;$('startLang').value=lang;refresh()});$('startLang').addEventListener('change',e=>{lang=e.target.value;$('lang').value=lang;refresh()});window.addEventListener('pagehide',stopAudio);refresh();
</script></body></html>
